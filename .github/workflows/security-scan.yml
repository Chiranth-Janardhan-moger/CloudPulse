name: Security Scanning

on:
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  # SAST - Static Application Security Testing
  sast-scan:
    name: SAST Code Scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript, typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  # Dependency vulnerability scanning
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Snyk test backend
        working-directory: ./backend
        run: |
          npm ci
          snyk test --severity-threshold=high || true
        continue-on-error: true

      - name: Snyk test frontend
        working-directory: ./frontend
        run: |
          npm ci
          snyk test --severity-threshold=high || true
        continue-on-error: true

  # Container image scanning
  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t backend-scan:latest ./backend

      - name: Build frontend image
        run: docker build -t frontend-scan:latest ./frontend

      - name: Run Trivy on backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: backend-scan:latest
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Run Trivy on frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend-scan:latest
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Run Grype scanner on backend
        uses: anchore/scan-action@v3
        with:
          image: backend-scan:latest
          fail-build: false
          severity-cutoff: high

      - name: Run Grype scanner on frontend
        uses: anchore/scan-action@v3
        with:
          image: frontend-scan:latest
          fail-build: false
          severity-cutoff: high

  # Secret scanning
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: TruffleHog OSS - Filesystem Scan
        run: |
          docker run --rm -v "$PWD:/scan" trufflesecurity/trufflehog:latest filesystem /scan --only-verified --json > trufflehog-results.json || true
          
      - name: Display Results
        run: |
          if [ -s trufflehog-results.json ]; then
            echo "⚠️ Secrets detected!"
            cat trufflehog-results.json
            exit 1
          else
            echo "✅ No secrets detected"
          fi

  # License compliance
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: Check backend licenses
        working-directory: ./backend
        run: |
          npm ci
          npx license-checker --summary || true

      - name: Check frontend licenses
        working-directory: ./frontend
        run: |
          npm ci
          npx license-checker --summary || true
