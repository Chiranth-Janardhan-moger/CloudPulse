version: '3.8'

services:
  backend:
    image: ghcr.io/chiranth-janardhan-moger/cloudpulse/backend:main-dac8e92
    container_name: cloudpulse-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    restart: unless-stopped
    networks:
      - cloudpulse-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/chiranth-janardhan-moger/cloudpulse/frontend:main-dac8e92
    container_name: cloudpulse-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cloudpulse-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  cloudpulse-network:
    driver: bridge
